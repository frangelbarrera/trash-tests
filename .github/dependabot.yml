version: 2
updates:
  # Keep dependency maintenance focused in one reviewable pull request.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      # Review npm dependency updates together.
      all-npm-deps:
        patterns:
          - '*'

  # Keep GitHub Actions updates in a focused pull request.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'automated'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
    groups:
      all-actions:
        patterns:
          - '*'
