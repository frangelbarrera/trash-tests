name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write   # required for npm provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release   # required for provenance + secrets scoping
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release candidate
        run: pnpm verify

      - name: Verify release version
        run: pnpm check-release-version "$GITHUB_REF_NAME"

      - name: Bundle GitHub Action
        run: |
          pnpm --filter @trash-tests/github-action bundle
          git diff --exit-code -- packages/github-action/dist

      - name: Publish public npm packages with provenance
        run: pnpm --filter @trash-tests/core --filter @trash-tests/reporters --filter @trash-tests/cli --filter trashtests -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
