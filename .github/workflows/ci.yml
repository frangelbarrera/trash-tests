name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Cancel in-progress runs for the same ref (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high --prod
        continue-on-error: true  # advisory; we don't want to block PRs on transitive vulns

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check score stability
        run: pnpm check-score-stability

      - name: Verify GitHub Action bundle is current
        run: |
          pnpm --filter @trash-tests/github-action bundle
          git diff --exit-code -- packages/github-action/dist

      - name: Verify npm package installation
        run: pnpm verify:package

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            packages/*/coverage
            packages/*/test-results
          retention-days: 7
